services:
  mysql:
    image: mysql:8.4
    container_name: topeco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: topeco
      MYSQL_USER: topeco
      MYSQL_PASSWORD: topeco
    ports:
      # Host 3306 is already taken by a local mysqld; container MySQL is on 3308.
      - "3308:3306"
    volumes:
      - topeco-mysql-data:/var/lib/mysql
      # Runs once, on first initialisation of an empty data volume.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptopeco"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    container_name: topeco-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  topeco-mysql-data:
